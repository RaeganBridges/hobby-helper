<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="view-transition" content="same-origin" />
  <title>Hobbies — Hobby Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="page-transitions.css" />
  <style>
    @font-face {
      font-family: 'Icebox_Trial:Magnet';
      src: local('Icebox Trial Magnet'), local('IceboxTrial-Magnet'),
           url('fonts/Icebox-Magnet.woff2') format('woff2'),
           url('fonts/Icebox-Magnet.otf') format('opentype'),
           url('fonts/Icebox-Magnet.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Icebox_Trial:Bold';
      src: local('Icebox Trial Bold'), local('IceboxTrial-Bold'),
           url('fonts/Icebox-Bold.woff2') format('woff2'),
           url('fonts/Icebox-Bold.otf') format('opentype'),
           url('fonts/Icebox-Bold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Carp_VF_Trial:Regular';
      src: local('Carp VF Trial Regular'), local('CarpVF_Trial-Regular'),
           url('fonts/Carp-Regular.woff2') format('woff2'),
           url('fonts/Carp-Regular.otf') format('opentype'),
           url('fonts/Carp-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Carp_VF_Trial:Italic';
      src: local('Carp VF Trial Italic'), local('CarpVF_Trial-Italic'),
           url('fonts/Carp-Italic.woff2') format('woff2'),
           url('fonts/Carp-Italic.otf') format('opentype'),
           url('fonts/Carp-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #e8bdd0;
      font-family: 'Carp_VF_Trial:Regular', 'Source Sans 3', system-ui, sans-serif;
    }

    .page-wrap {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8bdd0;
    }

    .shell {
      width: 100%;
      max-width: 430px;
      height: min(100dvh, 932px);
      background: #fff;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .page-wrap {
        background: linear-gradient(to bottom, #f5d8e8, #deb6ce);
        padding: 1.5rem 1rem;
      }
      .shell {
        height: min(932px, calc(100dvh - 3rem));
        border-radius: 2.75rem;
        box-shadow:
          0 25px 80px -20px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(0, 0, 0, 0.1);
      }
    }

    .frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 932px;
      height: 100%;
      overflow: hidden;
    }

    .inset-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 35px -10px rgba(0, 0, 0, 0.1);
    }

    .header-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 205px;
      background: #ff75a5;
      border-radius: 0 0 55px 55px;
      box-shadow: inset 0 5px 15px 10px rgba(0, 0, 0, 0.1);
      pointer-events: none;
    }

    .logo-wrap {
      position: absolute;
      height: 291px;
      left: 27px;
      top: -18px;
      width: 366px;
    }

    .logo-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .hobby-slot {
      position: absolute;
      left: -61px;
    }

    .hobby-slot--1 { top: 242px; width: 562.362px; }
    .hobby-slot--2 { top: 386.86px; width: 575.611px; }
    .hobby-slot--3 { top: 536.86px; width: 605.932px; }
    .hobby-slot--4 { top: 682.86px; width: 530.722px; }

    .tilt-1 { transform: rotate(1deg); }
    .tilt-n1 { transform: rotate(-1deg); }

    .hobby-card-link {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
    }

    .hobby-card {
      height: 116px;
      border-radius: 25px;
      background: #e45b8b;
      box-shadow: -4px 4px 6px rgba(0, 0, 0, 0.3);
      position: relative;
      transition: background-color 0.15s ease;
    }

    .hobby-card-link:hover .hobby-card,
    .hobby-card-link:focus-visible .hobby-card {
      background: #d84e7e;
    }

    .hobby-card-title {
      font-family: 'Icebox_Trial:Magnet', Fredoka, ui-sans-serif, system-ui, sans-serif;
      font-size: 32px;
      line-height: normal;
      font-style: normal;
      font-weight: normal;
      color: #fff;
      position: absolute;
      left: 80px;
      top: 12px;
      margin: 0;
      white-space: nowrap;
    }

    .hobby-card-desc {
      font-family: 'Carp_VF_Trial:Regular', 'Source Sans 3', system-ui, sans-serif;
      font-size: 20px;
      line-height: normal;
      font-weight: 400;
      color: #fff;
      position: absolute;
      left: 81px;
      top: 51px;
      width: 341px;
      margin: 0;
      font-variation-settings: 'wdth' 100;
    }

    .hobby-card-desc em {
      font-family: 'Carp_VF_Trial:Italic', 'Source Sans 3', system-ui, sans-serif;
      font-style: italic;
      font-variation-settings: 'wdth' 100;
    }

    .nav-rail {
      position: absolute;
      left: 43px;
      top: 852px;
      width: 344px;
      height: 42px;
      background: #ff75a5;
      border-radius: 25px;
      pointer-events: none;
    }

    .nav-link {
      position: absolute;
      top: 852px;
      height: 42px;
      border-radius: 25px;
      background: #ff75a5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      font-family: 'Icebox_Trial:Magnet', Fredoka, ui-sans-serif, system-ui, sans-serif;
      font-size: 24px;
      line-height: normal;
      transition: opacity 0.15s ease;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      opacity: 0.85;
      outline: none;
    }

    .nav-link--1 { left: 43px; width: 57px; }
    .nav-link--2 { left: 100px; width: 57px; }
    .nav-link--hobbies {
      left: 157px;
      width: 116px;
      background: #e45b8b;
      box-shadow: inset 0 0 7px 0 rgba(0, 0, 0, 0.25);
      font-family: 'Icebox_Trial:Bold', Fredoka, ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
    }

    .nav-link--hobbies:hover,
    .nav-link--hobbies:focus-visible {
      opacity: 1;
    }

    .nav-link--3 { left: 273px; width: 57px; }
    .nav-link--4 { left: 330px; width: 57px; }
  </style>
</head>
<body>
  <script src="reload-to-index.js"></script>
  <div class="page-wrap">
    <div class="shell">
      <div class="frame">
        <div class="inset-vignette" aria-hidden="true"></div>
        <div class="header-bar" aria-hidden="true"></div>

        <div class="logo-wrap">
          <img src="images/hobby-helper-logo.png" alt="Hobby Helper" width="366" height="291" />
        </div>

        <div class="hobby-slot hobby-slot--1">
          <div class="tilt-1">
            <a href="sewing.html" class="hobby-card-link">
              <div class="hobby-card">
                <p class="hobby-card-title">SEWING</p>
                <p class="hobby-card-desc">Make a new dress for the Delight formal dance.</p>
              </div>
            </a>
          </div>
        </div>

        <div class="hobby-slot hobby-slot--2">
          <div class="tilt-n1">
            <a href="car-repair.html" class="hobby-card-link">
              <div class="hobby-card">
                <p class="hobby-card-title">CAR REPAIR</p>
                <p class="hobby-card-desc">Fix the door wiring, headliner, and windows in the Bronco.</p>
              </div>
            </a>
          </div>
        </div>

        <div class="hobby-slot hobby-slot--3">
          <div class="tilt-1">
            <a href="games.html" class="hobby-card-link">
              <div class="hobby-card">
                <p class="hobby-card-title">GAMES</p>
                <p class="hobby-card-desc">Practice nerds, mahjong, and chess for the next time I am home.</p>
              </div>
            </a>
          </div>
        </div>

        <div class="hobby-slot hobby-slot--4">
          <div class="tilt-n1">
            <a href="reading.html" class="hobby-card-link">
              <div class="hobby-card">
                <p class="hobby-card-title">READING</p>
                <p class="hobby-card-desc">Finish <em>All Quiet on the Western Front</em> by Erich Maria Remarque.</p>
              </div>
            </a>
          </div>
        </div>

        <div class="nav-rail" aria-hidden="true"></div>

        <a href="sewing.html" class="nav-link nav-link--1" aria-label="Week 1, Sewing">1</a>
        <a href="car-repair.html" class="nav-link nav-link--2" aria-label="Week 2, Car repair">2</a>
        <a href="hobbies.html" class="nav-link nav-link--hobbies" aria-current="page">HOBBIES</a>
        <a href="games.html" class="nav-link nav-link--3" aria-label="Week 3, Games">3</a>
        <a href="reading.html" class="nav-link nav-link--4" aria-label="Week 4, Reading">4</a>
      </div>
    </div>
  </div>
</body>
</html>
