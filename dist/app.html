<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="view-transition" content="same-origin" />
    <title>Hobby Helper</title>
    <link rel="stylesheet" href="page-transitions.css" />
    <script type="module" crossorigin src="/assets/app-DY639rWk.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app-BKLIbKdy.css">
  </head>
  <body>
    <script>
      (function () {
        var reload = false;
        try {
          var entries = performance.getEntriesByType && performance.getEntriesByType('navigation');
          if (entries && entries.length > 0 && entries[0].type === 'reload') reload = true;
        } catch (e) {}
        if (!reload && typeof performance !== 'undefined' && performance.navigation) {
          try {
            if (performance.navigation.type === 1) reload = true;
          } catch (e2) {}
        }
        if (reload) window.location.replace('index.html');
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
