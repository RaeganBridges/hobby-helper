<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="view-transition" content="same-origin" />
  <title>Car Repair — Video — Hobby Helper</title>
  <link rel="stylesheet" href="page-transitions.css" />
  <style>
    @font-face {
      font-family: 'Carp_VF_Trial:Regular';
      src: local('Carp VF Trial Regular'), local('CarpVF_Trial-Regular'),
           url('fonts/Carp%20Trial/webfonts/Carp-Regular-Trial.woff2') format('woff2'),
           url('fonts/Carp%20Trial/Carp-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html {
      background-color: #e8bdd0;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #e8bdd0;
      font-family: 'Carp_VF_Trial:Regular', system-ui, sans-serif;
    }

    .page-wrap {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8bdd0;
    }
    .shell {
      width: 100%;
      max-width: 430px;
      height: min(100dvh, 932px);
      background: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 767px) {
      /*
        .frame only contains position:absolute children → no in-flow height.
        A flex .shell with only that child collapses to 0 height on mobile → black video.
        Use a height % chain + absolute fill so the video always has a real box.
      */
      html {
        height: 100%;
        overflow: hidden;
      }
      body {
        height: 100%;
        max-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      .page-wrap {
        position: fixed;
        inset: 0;
        z-index: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        box-sizing: border-box;
        overflow: hidden;
        display: block;
        min-height: 0;
      }
      .shell {
        display: block;
        height: 100%;
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
        overflow: hidden;
      }
      .frame {
        position: absolute;
        inset: 0;
        flex: none;
        width: auto;
        max-width: none;
        margin: 0;
        min-height: 0;
      }
    }
    @media (min-width: 768px) {
      .page-wrap {
        background: linear-gradient(to bottom, #f5d8e8, #deb6ce);
        padding: 1.5rem 1rem;
      }
      .shell {
        height: min(932px, calc(100dvh - 3rem));
        border-radius: 2.75rem;
        box-shadow:
          0 25px 80px -20px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(0, 0, 0, 0.1);
      }
    }

    .frame {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }

    .frame video {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .video-close {
      position: absolute;
      top: calc(24px + env(safe-area-inset-top, 0px));
      right: calc(28px + env(safe-area-inset-right, 0px));
      z-index: 10;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      filter: drop-shadow(-1.5px 3.5px 2px rgba(0, 0, 0, 0.42));
      transition: opacity 0.15s ease;
    }
    .video-close svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .video-close:hover,
    .video-close:focus-visible {
      opacity: 0.85;
      outline: none;
    }
  </style>
</head>
<body>
  <script src="reload-to-index.js"></script>
  <div class="page-wrap">
  <div class="shell">
    <div class="frame">
      <video
        id="car-video-el"
        autoplay
        loop
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        aria-label="Car repair week video"
      >
        <source src="videos/car-repair.mp4" type="video/mp4" />
      </video>
      <a class="video-close" href="car-repair.html" aria-label="Close video">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">
          <path d="M 10 10 L 46 46 M 46 10 L 10 46" fill="none" stroke="#40669a" stroke-width="11" stroke-linecap="round"/>
        </svg>
      </a>
    </div>
  </div>
  </div>
  <script>
    (function () {
      var v = document.getElementById('car-video-el');
      if (!v) return;
      v.muted = true;
      v.defaultMuted = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      function tryPlay() {
        var p = v.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {
            v.setAttribute('controls', '');
          });
        }
      }
      if (v.readyState >= 2) tryPlay();
      else v.addEventListener('canplay', tryPlay, { once: true });
      v.addEventListener('error', function () {
        v.setAttribute('controls', '');
      });
    })();
  </script>
</body>
</html>
