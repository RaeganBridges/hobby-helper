<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="view-transition" content="same-origin" />
  <title>Reading — Video — Hobby Helper</title>
  <link rel="stylesheet" href="page-transitions.css" />
  <style>
    @font-face {
      font-family: 'Carp_VF_Trial:Regular';
      src: local('Carp VF Trial Regular'), local('CarpVF_Trial-Regular'),
           url('fonts/Carp%20Trial/webfonts/Carp-Regular-Trial.woff2') format('woff2'),
           url('fonts/Carp%20Trial/Carp-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html {
      background-color: #e8bdd0;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #e8bdd0;
      font-family: 'Carp_VF_Trial:Regular', system-ui, sans-serif;
    }

    .page-wrap {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8bdd0;
    }
    .shell {
      width: 100%;
      max-width: 430px;
      height: min(100dvh, 932px);
      background: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 767px) {
      /*
        Video + close are absolute inside .frame → .frame needs height from flex, not from content.
        Chain: fixed page-wrap (column flex, fills viewport) → shell (flex:1) → frame (flex:1, relative).
        Do NOT position:absolute .frame — that removes it from flow and collapses .shell again.
      */
      html {
        height: 100%;
        overflow: hidden;
      }
      body {
        height: 100%;
        max-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      .page-wrap {
        position: fixed;
        inset: 0;
        z-index: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 0;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }
      .shell {
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Same absolute-fill video as desktop — grid + position:relative video often gets 0×0 on iOS. */
      .frame {
        position: relative;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        max-width: none;
        margin: 0;
      }
    }
    @media (min-width: 768px) {
      .page-wrap {
        background: linear-gradient(to bottom, #f5d8e8, #deb6ce);
        padding: 1.5rem 1rem;
      }
      .shell {
        height: min(932px, calc(100dvh - 3rem));
        border-radius: 2.75rem;
        box-shadow:
          0 25px 80px -20px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(0, 0, 0, 0.1);
      }
    }

    .frame {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }

    /* Avoid translateZ/isolation here — they have caused black frames on some iOS WebKit builds. */
    .frame video {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* One-hour timer: full-width bar at bottom (empties over 60 min on this screen) */
    .video-overlay-layer {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
    }
    .video-hour-bar {
      position: absolute;
      left: calc(32px + env(safe-area-inset-left, 0px));
      right: calc(32px + env(safe-area-inset-right, 0px));
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      height: 11px;
      border-radius: 999px;
      overflow: hidden;
      pointer-events: none;
      --vhr-bar-accent: #2c6124;
    }
    .video-hour-bar-track {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.22);
    }
    .video-hour-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(1);
      background: var(--vhr-bar-accent);
    }

    .video-close {
      position: absolute;
      top: calc(24px + env(safe-area-inset-top, 0px));
      right: calc(28px + env(safe-area-inset-right, 0px));
      z-index: 100;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      filter: drop-shadow(-1.5px 3.5px 2px rgba(0, 0, 0, 0.42));
      transition: opacity 0.15s ease;
    }
    .video-close svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .video-close:hover,
    .video-close:focus-visible {
      opacity: 0.85;
      outline: none;
    }

    /* Opt-in: add ?debug=1 to the URL */
    #video-debug-panel {
      display: none;
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: max(8px, env(safe-area-inset-bottom, 0px));
      max-height: 42vh;
      overflow: auto;
      margin: 0;
      padding: 8px 10px;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #d8ffd8;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 8px;
      z-index: 10000;
      pointer-events: none;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
    body.video-debug-on #video-debug-panel {
      display: block;
    }
  </style>
</head>
<body>
  <script src="reload-to-index.js"></script>
  <div class="page-wrap">
  <div class="shell">
    <div class="frame">
      <video
        id="reading-video-el"
        autoplay
        loop
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        aria-label="Reading week video"
      >
        <!-- Web-optimized MP4: H.264 + AAC (see scripts/reencode-videos-mobile.sh) -->
        <source src="/videos/book.mp4" type="video/mp4" data-week2-src="/videos/reading-week2.mp4" data-week3-src="/videos/reading-week3.mp4" data-week4-src="/videos/reading-week4.mp4" />
      </video>
      <div class="video-overlay-layer">
        <div class="video-hour-bar" aria-hidden="true">
          <div class="video-hour-bar-track"></div>
          <div class="video-hour-bar-fill"></div>
        </div>
      </div>
      <a class="video-close" href="reading.html" aria-label="Close video">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">
          <path d="M 10 10 L 46 46 M 46 10 L 10 46" fill="none" stroke="#2c6124" stroke-width="11" stroke-linecap="round"/>
        </svg>
      </a>
    </div>
  </div>
  </div>
  <script>
    (function () {
      var fill = document.querySelector('.video-hour-bar-fill');
      if (!fill) return;
      var HOUR_MS = 60 * 60 * 1000;
      var start = Date.now();
      function tick() {
        var elapsed = Date.now() - start;
        var t = Math.min(1, Math.max(0, elapsed / HOUR_MS));
        fill.style.transform = 'scaleX(' + (1 - t) + ')';
        if (t < 1) requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
  <script>
    (function () {
      var v = document.getElementById('reading-video-el');
      if (!v) return;
      var weekParam = new URLSearchParams(window.location.search).get('week');
      var weekNum = weekParam != null ? parseInt(weekParam, 10) : NaN;
      var srcEl = v.querySelector('source');
      if (srcEl) {
        var w2 = srcEl.getAttribute('data-week2-src') || '/videos/reading-week2.mp4';
        var w3 = srcEl.getAttribute('data-week3-src') || '/videos/reading-week3.mp4';
        var w4 = srcEl.getAttribute('data-week4-src') || '/videos/reading-week4.mp4';
        var pick = '/videos/book.mp4';
        if (weekNum === 2) pick = w2;
        else if (weekNum === 3) pick = w3;
        else if (weekNum === 4) pick = w4;
        srcEl.setAttribute('src', pick);
        try {
          v.load();
        } catch (eLoad) {}
      }
      var isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      /* iOS: small seek after metadata. Do NOT append #t= to src — breaks Range/CDN + Safari. */
      if (isIOS) {
        v.addEventListener(
          'loadedmetadata',
          function () {
            try {
              if (v.readyState >= 1) v.currentTime = 0.05;
            } catch (eT) {}
          },
          { once: true }
        );
      }
      v.muted = true;
      v.defaultMuted = true;
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      function tryPlay() {
        var p = v.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {
            v.setAttribute('controls', '');
          });
        }
      }
      if (v.readyState >= 2) tryPlay();
      else v.addEventListener('canplay', tryPlay, { once: true });
      v.addEventListener('error', function () {
        v.setAttribute('controls', '');
      });

      /* Mobile: force shell/frame height in px — flex/% chains still fail on some iOS versions. */
      (function mobileVideoLayout() {
        var wrap = document.querySelector('.page-wrap');
        var shell = document.querySelector('.shell');
        var frame = document.querySelector('.frame');
        if (!wrap || !shell || !frame) return;
        function apply() {
          if (window.matchMedia('(min-width: 768px)').matches) {
            shell.style.removeProperty('height');
            shell.style.removeProperty('min-height');
            shell.style.removeProperty('max-height');
            frame.style.removeProperty('height');
            frame.style.removeProperty('min-height');
            return;
          }
          var h = wrap.getBoundingClientRect().height;
          if (h < 2) h = window.innerHeight;
          shell.style.boxSizing = 'border-box';
          shell.style.height = h + 'px';
          shell.style.minHeight = h + 'px';
          shell.style.maxHeight = h + 'px';
          frame.style.height = h + 'px';
          frame.style.minHeight = h + 'px';
          try {
            var playP = v.play();
            if (playP && typeof playP.catch === 'function') playP.catch(function () {});
          } catch (ePlay) {}
        }
        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', function () {
          setTimeout(apply, 350);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
        }
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) setTimeout(apply, 50);
        });
        requestAnimationFrame(function () {
          apply();
          setTimeout(apply, 100);
        });
        v.addEventListener('loadedmetadata', function () {
          requestAnimationFrame(apply);
        });
        v.addEventListener('loadeddata', function () {
          requestAnimationFrame(apply);
        });
      })();

      /* ?debug=1 — layout + playback diagnostics (Safari / phone black-screen) */
      try {
        if (new URLSearchParams(window.location.search).get('debug') !== '1') return;
        document.body.classList.add('video-debug-on');
        var panel = document.createElement('pre');
        panel.id = 'video-debug-panel';
        panel.setAttribute('aria-live', 'polite');
        document.body.appendChild(panel);
        function fmtRect(el, label) {
          if (!el) return label + ': (missing)';
          var r = el.getBoundingClientRect();
          return (
            label +
            ': w=' +
            Math.round(r.width) +
            ' h=' +
            Math.round(r.height) +
            ' t=' +
            Math.round(r.top)
          );
        }
        function errLine() {
          var e = v.error;
          if (!e) return 'error: none';
          return 'error: code=' + e.code + ' (' + (e.message || 'n/a') + ')';
        }
        function tick() {
          var frame = document.querySelector('.frame');
          var shell = document.querySelector('.shell');
          var wrap = document.querySelector('.page-wrap');
          var lines = [
            'debug=1 | ' + (window.innerWidth + '×' + window.innerHeight) + ' dpr=' + (window.devicePixelRatio || 1),
            errLine(),
            'video: intrinsic ' + v.videoWidth + '×' + v.videoHeight + ' | readyState=' + v.readyState + ' networkState=' + v.networkState + ' paused=' + v.paused,
            fmtRect(v, 'video'),
            fmtRect(frame, 'frame'),
            fmtRect(shell, 'shell'),
            fmtRect(wrap, 'page-wrap'),
          ];
          var text = lines.join('\n');
          panel.textContent = text;
          if (window.console && console.debug) console.debug('[video-debug]', text);
        }
        tick();
        setInterval(tick, 500);
        ['loadedmetadata', 'loadeddata', 'canplay', 'playing', 'resize'].forEach(function (ev) {
          if (ev === 'resize') window.addEventListener('resize', tick);
          else v.addEventListener(ev, tick);
        });
      } catch (ignore) {}
    })();
  </script>
</body>
</html>
