<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="view-transition" content="same-origin" />
    <title>Hobby Helper</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/hh-logo-favicon-64.png" />
    <link rel="stylesheet" href="page-transitions.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      /* Hot pink behind slides only (replaces former black phone-sized area); page chrome stays hobby default */
      :root {
        --flood-pink: #d6648b;
      }
      html {
        background-color: #e8bdd0;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        min-height: 100vh;
        background: #e8bdd0;
        overflow: hidden;
      }

      .page-wrap {
        min-height: 100dvh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #e8bdd0;
      }

      /* Same phone column as hobbies.html (430 × up to 932) */
      .shell {
        width: 100%;
        max-width: 430px;
        height: min(100dvh, 932px);
        background: var(--flood-pink);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      @media (max-width: 767px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }
        .page-wrap {
          position: fixed;
          inset: 0;
          z-index: 0;
          min-height: 0;
          padding: 0 env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
          box-sizing: border-box;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          overflow: hidden;
        }
        .shell {
          flex: 1 1 0;
          min-height: 0;
          width: 100%;
          max-width: 430px;
          height: auto !important;
          margin: 0 auto;
        }
      }

      @media (min-width: 768px) {
        .page-wrap {
          background: linear-gradient(to bottom, #f8dce8, #e8b0c4);
          padding: 1.5rem 1rem;
        }
        .shell {
          height: min(932px, calc(100dvh - 3rem));
          border-radius: 2.75rem;
          box-shadow:
            0 25px 80px -20px rgba(0, 0, 0, 0.35),
            0 0 0 1px rgba(0, 0, 0, 0.1);
        }
      }

      .flood-stage {
        position: relative;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        background: var(--flood-pink);
      }

      .flood-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Underlay: always full opacity so pink never shows *between* slides */
      .flood-img.flood-base {
        z-index: 1;
        opacity: 1;
      }

      /* Incoming slide only: fades 0 → 1 on top of previous (no dual-fade → no gap) */
      .flood-img.flood-overlay {
        z-index: 2;
        opacity: 0;
        transition: opacity var(--flood-blend-ms, 900ms) cubic-bezier(0.22, 0.1, 0.22, 1);
        will-change: opacity;
      }

      .flood-img.flood-overlay.is-in {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .flood-img.flood-overlay {
          transition-duration: 0.001ms;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div class="shell" aria-busy="true">
        <div class="flood-stage">
          <img
            id="flood-base"
            class="flood-img flood-base"
            alt=""
            decoding="async"
            src="/images/flood/01-logo.png"
          />
          <img
            id="flood-overlay"
            class="flood-img flood-overlay"
            alt=""
            decoding="async"
            src=""
          />
        </div>
      </div>
    </div>
    <script>
      (function () {
        var TARGET = 'hobbies.html';
        var FPS = 60;
        /* 1:00f → 60 frames @ 60fps = 1s hold; each other slide 20f */
        var FIRST_HOLD_FRAMES = 60;
        var OTHER_HOLD_FRAMES = 20;
        /* Incoming-only fade; longer = smoother (~55f @ 60fps ≈ 917ms) */
        var BLEND_FRAMES = 55;

        var SLIDES = [
          '/images/flood/01-logo.png',
          '/images/flood/02-games.png',
          '/images/flood/03-sewing.png',
          '/images/flood/04-reading.png',
          '/images/flood/05-car.png',
        ];

        function framesToMs(frames) {
          return (frames / FPS) * 1000;
        }

        var reduceMotion =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var blendMs = reduceMotion ? 0 : framesToMs(BLEND_FRAMES);
        document.documentElement.style.setProperty('--flood-blend-ms', blendMs + 'ms');

        var baseEl = document.getElementById('flood-base');
        var overlayEl = document.getElementById('flood-overlay');
        if (!baseEl || !overlayEl) {
          window.location.replace(TARGET);
          return;
        }

        var slideIndex = 0;

        function goHobbies() {
          var shell = document.querySelector('.shell');
          if (shell) shell.setAttribute('aria-busy', 'false');
          if (typeof document.startViewTransition === 'function') {
            document.startViewTransition(function () {
              window.location.replace(TARGET);
            });
          } else {
            window.location.replace(TARGET);
          }
        }

        function crossfadeTo(nextIndex, then) {
          overlayEl.src = SLIDES[nextIndex];
          overlayEl.classList.remove('is-in');
          void overlayEl.offsetWidth;
          overlayEl.classList.add('is-in');
          window.setTimeout(function () {
            baseEl.src = SLIDES[nextIndex];
            overlayEl.classList.remove('is-in');
            slideIndex = nextIndex;
            then();
          }, blendMs + 80);
        }

        function tick() {
          if (slideIndex >= SLIDES.length - 1) {
            window.setTimeout(goHobbies, framesToMs(OTHER_HOLD_FRAMES));
            return;
          }
          var holdFrames =
            slideIndex === 0 ? FIRST_HOLD_FRAMES : OTHER_HOLD_FRAMES;
          var next = slideIndex + 1;
          window.setTimeout(function () {
            crossfadeTo(next, tick);
          }, framesToMs(holdFrames));
        }

        if (reduceMotion) {
          window.setTimeout(goHobbies, 400);
          return;
        }

        tick();
      })();
    </script>
  </body>
</html>
