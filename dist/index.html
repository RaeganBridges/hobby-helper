<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="view-transition" content="same-origin" />
    <title>Hobby Helper</title>
    <link rel="stylesheet" href="page-transitions.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        min-height: 100dvh;
        min-height: 100vh;
        background: #e8bdd0;
      }
      @media (min-width: 768px) {
        body {
          background: linear-gradient(to bottom, #f5d8e8, #deb6ce);
        }
      }
    </style>
    <script>
      (function () {
        var delayMs = 3000;
        var target = 'hobbies.html';
        function go() {
          window.location.replace(target);
        }
        window.setTimeout(go, delayMs);
      })();
    </script>
  </head>
  <body></body>
</html>
