<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="view-transition" content="same-origin" />
  <title>Sewing — Hobby Helper</title>
  <link rel="stylesheet" href="page-transitions.css" />
  <link rel="stylesheet" href="hobby-flood-reset.css" />
  <style>
    @font-face {
      font-family: 'Icebox_Trial:Magnet';
      src: local('Icebox Trial Magnet'), local('IceboxTrial-Magnet'),
           url('fonts/Icebox%20Trial/webfonts/Icebox-Magnet-Trial.woff2') format('woff2'),
           url('fonts/Icebox%20Trial/Icebox-Magnet-Trial.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Icebox_Trial:Bold';
      src: local('Icebox Trial Bold'), local('IceboxTrial-Bold'),
           url('fonts/Icebox%20Trial/webfonts/Icebox-Bold-Trial.woff2') format('woff2'),
           url('fonts/Icebox%20Trial/Icebox-Bold-Trial.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Carp_VF_Trial:Regular';
      src: local('Carp VF Trial Regular'), local('CarpVF_Trial-Regular'),
           url('fonts/Carp%20Trial/webfonts/Carp-Regular-Trial.woff2') format('woff2'),
           url('fonts/Carp%20Trial/Carp-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Carp_VF_Trial:Italic';
      src: local('Carp VF Trial Italic'), local('CarpVF_Trial-Italic'),
           url('fonts/Carp%20Trial/webfonts/Carp-RegularItalic-Trial.woff2') format('woff2'),
           url('fonts/Carp%20Trial/Carp-RegularItalic-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html {
      background-color: #e8bdd0;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      background: #e8bdd0;
      font-family: 'Carp_VF_Trial:Regular', system-ui, sans-serif;
    }

    .page-wrap {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8bdd0;
    }

    .shell {
      width: 100%;
      max-width: 430px;
      height: min(100dvh, 932px);
      background: #fff;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    @media (max-width: 767px) {
      body {
        overflow: hidden;
      }
      .page-wrap {
        position: fixed;
        inset: 0;
        z-index: 0;
        min-height: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        box-sizing: border-box;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow: hidden;
      }
      .shell {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-width: 430px;
        height: auto !important;
        margin: 0 auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    @media (min-width: 768px) {
      .page-wrap {
        background: linear-gradient(to bottom, #fff8e8, #f0dfa0);
        padding: 1.5rem 1rem;
      }
      .shell {
        height: min(932px, calc(100dvh - 3rem));
        border-radius: 2.75rem;
        box-shadow:
          0 25px 80px -20px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(0, 0, 0, 0.1);
      }
    }

    .frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 932px;
      height: 100%;
    }

    .bg-tint {
      position: absolute;
      inset: 0;
      background: #ffefbc;
      opacity: 0.35;
      box-shadow: inset 0 0 35px -10px rgba(0,0,0,0.1);
      pointer-events: none;
    }

    .header-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 177px;
      background: #ffdc69;
      border-radius: 0 0 55px 55px;
      box-shadow: inset 0 5px 15px 10px rgba(0,0,0,0.1);
      pointer-events: none;
    }

    .title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 70px;
      margin: 0;
      font-family: 'Icebox_Trial:Magnet', ui-sans-serif, system-ui, sans-serif;
      font-size: 72px;
      line-height: 1;
      color: #8f6922;
      white-space: nowrap;
      text-align: center;
    }

    /* Background orange cards (tilted) */
    .card-bg {
      position: absolute;
      width: 324px;
      height: 116px;
      background: #e8a719;
      border-radius: 25px;
      box-shadow: -5px 5px 3px rgba(0,0,0,0.23), -2px 2px 2px rgba(0,0,0,0.14);
    }
    .card-bg.r1 { left: -38px; top: 229px; transform: rotate(-2deg); }
    .card-bg.r2 { left: -36px; top: 383px; transform: none; }
    .card-bg.r3 { left: -38px; top: 525px; transform: rotate(2deg); }
    .card-bg.r4 { left: -38px; top: 673px; transform: rotate(-2deg); }

    .play-btn {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: visible;
    }
    /* Clicks hit the button, not the SVG (filter can skew hit-testing). */
    .play-btn svg {
      width: 50px;
      height: 45px;
      overflow: visible;
      pointer-events: none;
    }
    .play-btn:disabled:not(.play-btn-complete) {
      opacity: 0.38;
      cursor: not-allowed;
    }
    .play-btn.play-btn-complete:disabled {
      opacity: 1;
      cursor: default;
    }

    .play-1 { position: absolute; top: 239px; right: 3px; }
    .play-wrap-2 { position: absolute; top: 387px; right: 3px; transform: rotate(5deg); }
    .play-3 { position: absolute; top: 535px; right: 3px; }
    .play-wrap-4 { position: absolute; top: 683px; right: 3px; transform: rotate(-6deg); }

    .week-label {
      font-family: 'Icebox_Trial:Magnet', ui-sans-serif, system-ui, sans-serif;
      font-size: 32px;
      color: #fff9e8;
      margin: 0;
      white-space: nowrap;
    }
    .week-desc {
      font-family: 'Carp_VF_Trial:Regular', system-ui, sans-serif;
      font-size: 20px;
      line-height: 1.25;
      color: #fff9e8;
      margin: 0;
      max-width: 245px;
      font-variation-settings: 'wdth' 100;
    }

    .w1-label { position: absolute; left: 18px; top: 247px; transform: rotate(-2deg); }
    .w1-desc { position: absolute; left: 20px; top: 283px; transform: rotate(-2deg); }
    .w2-label { position: absolute; left: 19px; top: 396px; }
    .w2-desc { position: absolute; left: 20px; top: 435px; }
    .w3-label { position: absolute; left: 18px; top: 540px; transform: rotate(2deg); }
    .w3-desc { position: absolute; left: 19px; top: 579px; transform: rotate(2deg); }
    .w4-label { position: absolute; left: 18px; top: 689px; transform: rotate(-2deg); }
    .w4-desc { position: absolute; left: 18px; top: 726px; transform: rotate(-2deg); }

    /* Decorative only — let clicks reach the play buttons. */
    .side-panel {
      position: absolute;
      left: 313px;
      width: 261px;
      height: 116px;
      background: #f9de87;
      border-radius: 25px;
      pointer-events: none;
    }
    .side-panel.p1 { top: 235px; }
    .side-panel.p2 { top: 383px; }
    .side-panel.p3 { top: 531px; }
    .side-panel.p4 { top: 679px; }

    /* Bottom nav */
    .nav-track {
      position: absolute;
      left: 43px;
      top: 852px;
      width: 344px;
      height: 42px;
      background: #f9db79;
      border-radius: 25px;
      pointer-events: none;
    }
    .nav a,
    .nav .slot-1 {
      position: absolute;
      top: 852px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 25px;
    }
    .nav a {
      text-decoration: none;
      font-family: 'Icebox_Trial:Magnet', ui-sans-serif, system-ui, sans-serif;
      font-size: 24px;
      color: #8f6922;
      cursor: pointer;
      z-index: 2;
    }
    .nav a:hover { opacity: 0.88; }
    .nav .slot-1 {
      left: 43px;
      width: 57px;
      background: #edc33a;
      box-shadow: inset 0 0 7px 0 rgba(0,0,0,0.25);
      font-family: 'Icebox_Trial:Bold', ui-sans-serif, system-ui, sans-serif;
      font-size: 24px;
      color: #6e4d11;
      z-index: 1;
      pointer-events: none;
    }
    .nav .slot-2 { left: 100px; width: 57px; background: #ffdc69; }
    .nav .slot-h { left: 157px; width: 116px; background: #ffdc69; }
    .nav .slot-3 { left: 273px; width: 57px; background: #ffdc69; }
    .nav .slot-4 { left: 330px; width: 57px; background: #ffdc69; }
  </style>
  <link rel="stylesheet" href="video-embed.css" />
</head>
<body>
  <script src="reload-to-index.js"></script>
  <div class="page-wrap">
  <div class="shell">
    <div class="frame">
      <svg class="play-filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
          <filter id="sewingPlayDeboss" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2.35" result="blur"/>
            <feOffset in="blur" dx="7.7" dy="5.6" result="offsetBlur"/>
            <feComposite in="SourceAlpha" in2="offsetBlur" operator="out" result="inverse"/>
            <feFlood flood-color="#5e4d26" flood-opacity="0.30" result="shadowColor"/>
            <feComposite in="shadowColor" in2="inverse" operator="in" result="innerShadow"/>
            <feMerge>
              <feMergeNode in="SourceGraphic"/>
              <feMergeNode in="innerShadow"/>
            </feMerge>
          </filter>
          <filter id="sewingCheckDeboss" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2.35" result="blur"/>
            <!-- Check only: (7.7, 5.6) rotated −270° → (−5.6, 7.7) -->
            <feOffset in="blur" dx="-5.6" dy="7.7" result="offsetBlur"/>
            <feComposite in="SourceAlpha" in2="offsetBlur" operator="out" result="inverse"/>
            <feFlood flood-color="#5e4d26" flood-opacity="0.30" result="shadowColor"/>
            <feComposite in="shadowColor" in2="inverse" operator="in" result="innerShadow"/>
            <feMerge>
              <feMergeNode in="SourceGraphic"/>
              <feMergeNode in="innerShadow"/>
            </feMerge>
          </filter>
        </defs>
      </svg>
      <div class="bg-tint" aria-hidden="true"></div>
      <div class="header-bar" aria-hidden="true"></div>
      <button type="button" class="title" data-hobby-flood-title aria-label="Replay intro and reset week progress for sewing">SEWING</button>

      <div class="card-bg r1" aria-hidden="true"></div>
      <div class="card-bg r4" aria-hidden="true"></div>
      <div class="card-bg r2" aria-hidden="true"></div>
      <div class="card-bg r3" aria-hidden="true"></div>

      <div class="side-panel p1" aria-hidden="true"></div>
      <div class="side-panel p2" aria-hidden="true"></div>
      <div class="side-panel p3" aria-hidden="true"></div>
      <div class="side-panel p4" aria-hidden="true"></div>

      <p class="week-label w1-label">WEEK ONE</p>
      <p class="week-desc w1-desc">Find pattern, fabric, and pin them together.</p>

      <p class="week-label w2-label">WEEK TWO</p>
      <p class="week-desc w2-desc">Cut out the pattern, pin pieces, and start sewing.</p>

      <p class="week-label w3-label">WEEK THREE</p>
      <p class="week-desc w3-desc">Continue sewing the pieces together.</p>

      <p class="week-label w4-label">WEEK FOUR</p>
      <p class="week-desc w4-desc">Finish sewing the dress and clean it up.</p>

      <button type="button" class="play-btn play-1" aria-label="Play week one video">
        <svg viewBox="0 0 57.5931 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">
          <g transform="rotate(90 28.79655 26)" filter="url(#sewingPlayDeboss)">
            <path d="M21.8683 4C24.9475 -1.33333 32.6455 -1.33334 35.7247 4L56.5094 40C59.5886 45.3333 55.7396 52 49.5812 52H8.01194C1.85354 52 -1.99547 45.3333 1.08373 40L21.8683 4Z" fill="#e8c547"/>
          </g>
        </svg>
      </button>
      <div class="play-wrap-2">
        <button type="button" class="play-btn" aria-label="Play week two video">
          <svg viewBox="0 0 57.5931 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">
            <g transform="rotate(90 28.79655 26)" filter="url(#sewingPlayDeboss)">
              <path d="M21.8683 4C24.9475 -1.33333 32.6455 -1.33334 35.7247 4L56.5094 40C59.5886 45.3333 55.7396 52 49.5812 52H8.01194C1.85354 52 -1.99547 45.3333 1.08373 40L21.8683 4Z" fill="#e8c547"/>
            </g>
          </svg>
        </button>
      </div>
      <button type="button" class="play-btn play-3" aria-label="Play week three video">
        <svg viewBox="0 0 57.5931 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">
          <g transform="rotate(90 28.79655 26)" filter="url(#sewingPlayDeboss)">
            <path d="M21.8683 4C24.9475 -1.33333 32.6455 -1.33334 35.7247 4L56.5094 40C59.5886 45.3333 55.7396 52 49.5812 52H8.01194C1.85354 52 -1.99547 45.3333 1.08373 40L21.8683 4Z" fill="#e8c547"/>
          </g>
        </svg>
      </button>
      <div class="play-wrap-4">
        <button type="button" class="play-btn" aria-label="Play week four video">
          <svg viewBox="0 0 57.5931 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">
            <g transform="rotate(90 28.79655 26)" filter="url(#sewingPlayDeboss)">
              <path d="M21.8683 4C24.9475 -1.33333 32.6455 -1.33334 35.7247 4L56.5094 40C59.5886 45.3333 55.7396 52 49.5812 52H8.01194C1.85354 52 -1.99547 45.3333 1.08373 40L21.8683 4Z" fill="#e8c547"/>
            </g>
          </svg>
        </button>
      </div>

      <div class="nav-track" aria-hidden="true"></div>
      <nav class="nav" aria-label="Hobby sections">
        <span class="slot-1">1</span>
        <a class="slot-2" href="/car-repair.html">2</a>
        <a class="slot-h" href="hobbies.html">Hobbies</a>
        <a class="slot-3" href="/games.html">3</a>
        <a class="slot-4" href="/reading.html">4</a>
      </nav>
    </div>
  </div>
  </div>
  <script>
    window.HOBBY_FLOOD_RESET = {
      keys: ['sewing-played-weeks-v4', 'sewing-played-weeks-v3'],
      secondSrc: '/images/flood/03-sewing.png',
      desktopBackdrop: 'linear-gradient(to bottom, #fff8e8, #f0dfa0)',
    };
  </script>
  <script src="hobby-flood-reset.js"></script>
  <script src="video-embed.js"></script>
  <script>
    (function () {
      var KEY = 'sewing-played-weeks-v4';
      var VIDEO_DEFAULT = '/videos/sewing.mp4';
      var VIDEO_WEEK_TWO = '/videos/sewing-week2.mp4';
      var VIDEO_WEEK_THREE = '/videos/sewing-week3.mp4';
      var VIDEO_WEEK_FOUR = '/videos/sewing-week4.mp4';
      var CLOSE_STROKE = '#e8c547';
      var FALLBACK_VIDEO_PAGE = '/sewing-video.html';
      var PLAY_HTML =
        '<svg viewBox="0 0 57.5931 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">' +
        '<g transform="rotate(90 28.79655 26)" filter="url(#sewingPlayDeboss)">' +
        '<path d="M21.8683 4C24.9475 -1.33333 32.6455 -1.33334 35.7247 4L56.5094 40C59.5886 45.3333 55.7396 52 49.5812 52H8.01194C1.85354 52 -1.99547 45.3333 1.08373 40L21.8683 4Z" fill="#e8c547"/>' +
        '</g></svg>';
      var CHECK_HTML =
        '<svg viewBox="-3 -3 62 58" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" overflow="visible">' +
        '<g filter="url(#sewingCheckDeboss)">' +
        '<g transform="translate(28 26) scale(1.52) translate(-28 -26)">' +
        '<path d="M 11.5 28.5 L 23 40 L 45 11" fill="none" stroke="#e8c547" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</g></g></svg>';

      function loadPlayed() {
        try {
          var raw = localStorage.getItem(KEY);
          if (!raw) return new Set();
          var arr = JSON.parse(raw);
          return new Set(Array.isArray(arr) ? arr : []);
        } catch (e) {
          return new Set();
        }
      }
      function savePlayed(set) {
        localStorage.setItem(KEY, JSON.stringify(Array.from(set)));
      }
      var PLAY_BTNS = [
        { btn: document.querySelector('.play-btn.play-1'), week: 1 },
        { btn: document.querySelector('.play-wrap-2 .play-btn'), week: 2 },
        { btn: document.querySelector('.play-btn.play-3'), week: 3 },
        { btn: document.querySelector('.play-wrap-4 .play-btn'), week: 4 },
      ];

      function apply(btn, week, played) {
        btn.innerHTML = played.has(week) ? CHECK_HTML : PLAY_HTML;
      }
      function canOpenWeek(week, played) {
        if (week <= 1) return true;
        if (played.has(week)) return true;
        return played.has(week - 1);
      }
      function setUnlockedState(btn, week, played) {
        if (!btn) return;
        var done = played.has(week);
        var open = canOpenWeek(week, played);
        var canPlay = open && !done;
        btn.disabled = !canPlay;
        if (done) btn.classList.add('play-btn-complete');
        else btn.classList.remove('play-btn-complete');
        btn.setAttribute('aria-disabled', canPlay ? 'false' : 'true');
        var base =
          week === 1
            ? 'Play week one'
            : week === 2
              ? 'Play week two'
              : week === 3
                ? 'Play week three'
                : 'Play week four';
        var doneLabel =
          week === 1
            ? 'Week one completed'
            : week === 2
              ? 'Week two completed'
              : week === 3
                ? 'Week three completed'
                : 'Week four completed';
        var label = done ? doneLabel : open ? base : base + ' (complete previous week first)';
        btn.setAttribute('aria-label', label);
      }
      function refreshPlayStates() {
        var played = loadPlayed();
        for (var i = 0; i < PLAY_BTNS.length; i++) {
          var item = PLAY_BTNS[i];
          if (!item.btn) continue;
          apply(item.btn, item.week, played);
          setUnlockedState(item.btn, item.week, played);
        }
      }
      function videoSrcForWeek(week) {
        if (week === 2) return VIDEO_WEEK_TWO;
        if (week === 3) return VIDEO_WEEK_THREE;
        if (week === 4) return VIDEO_WEEK_FOUR;
        return VIDEO_DEFAULT;
      }
      function bind(btn, week) {
        if (!btn) return;
        btn.addEventListener('click', function () {
          var played = loadPlayed();
          if (!canOpenWeek(week, played)) return;
          if (played.has(week)) return;
          var next = loadPlayed();
          next.add(week);
          savePlayed(next);
          refreshPlayStates();
          try {
            if (typeof openHobbyVideoEmbed === 'function') {
              openHobbyVideoEmbed({
                src: videoSrcForWeek(week),
                week: week,
                closeStroke: CLOSE_STROKE,
                desktopBackdrop:
                  window.HOBBY_FLOOD_RESET && window.HOBBY_FLOOD_RESET.desktopBackdrop,
              });
            } else {
              window.location.assign(
                FALLBACK_VIDEO_PAGE + '?week=' + encodeURIComponent(week)
              );
            }
          } catch (err) {
            window.location.assign(
              FALLBACK_VIDEO_PAGE + '?week=' + encodeURIComponent(week)
            );
          }
        });
      }
      for (var j = 0; j < PLAY_BTNS.length; j++) {
        bind(PLAY_BTNS[j].btn, PLAY_BTNS[j].week);
      }
      refreshPlayStates();
    })();
  </script>
</body>
</html>
